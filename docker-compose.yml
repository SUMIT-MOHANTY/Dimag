# Open LMS - Docker Compose Configuration
# Full stack orchestration for production and development

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: openlms-db
    environment:
      POSTGRES_DB: openlms
      POSTGRES_USER: openlms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - openlms_network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: openlms-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - openlms_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openlms-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://openlms:${POSTGRES_PASSWORD:-changeme}@db:5432/openlms
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - openlms_network
    # Run migrations before starting the server
    command: >
      sh -c "cd /app && alembic upgrade head && 
             gunicorn backend.app.main:app -w 4 -k uvicorn.workers.UvicornWorker 
             --bind 0.0.0.0:8000 --timeout 120 --access-logfile - --error-logfile -"

  # Frontend Static Build
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openlms-frontend
    # No exposed ports - served via nginx
    restart: unless-stopped
    networks:
      - openlms_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.26-alpine
    container_name: openlms-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - openlms_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  openlms_network:
    driver: bridge
